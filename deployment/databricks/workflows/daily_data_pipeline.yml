resources:
  jobs:
    daily_data_pipeline:
      name: banking-${var.environment}-daily-data
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: 0 0 4 * * ?
        timezone_id: Europe/Berlin
        pause_status: PAUSED
      tags:
        implementation: PRODUCTION_REFERENCE_NOT_DEPLOYED
      tasks:
      - task_key: 01_source_validation
        existing_cluster_id: ${var.existing_cluster_id}
        spark_python_task:
          python_file: ${var.task_entry_path}
          parameters:
          - --task
          - 01_source_validation
          - --env
          - ${var.environment}
          - --pipeline-run-id
          - '{{job.run_id}}'
        max_retries: 0
        timeout_seconds: 3600
      - task_key: 02_bronze_ingestion
        existing_cluster_id: ${var.existing_cluster_id}
        spark_python_task:
          python_file: ${var.task_entry_path}
          parameters:
          - --task
          - 02_bronze_ingestion
          - --env
          - ${var.environment}
          - --pipeline-run-id
          - '{{job.run_id}}'
        max_retries: 0
        timeout_seconds: 3600
        depends_on:
        - task_key: 01_source_validation
      - task_key: 03_silver_transformation
        existing_cluster_id: ${var.existing_cluster_id}
        spark_python_task:
          python_file: ${var.task_entry_path}
          parameters:
          - --task
          - 03_silver_transformation
          - --env
          - ${var.environment}
          - --pipeline-run-id
          - '{{job.run_id}}'
