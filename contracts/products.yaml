dataset: products
contract_version: '1.0'
owner: Digital Banking Data Owner
technical_owner: Data Engineering
description: Typed accepted synthetic products; final states must not be backfilled
  into historical ML features.
layer: silver
primary_key:
- product_id
allow_extra_columns: true
fields:
  customer_id:
    type: string
    nullable: false
  product_id:
    type: string
    nullable: false
  product_type:
    type: string
    nullable: false
    allowed_values:
    - Current Account
    - Savings Account
    - Credit Card
    - Debit Card
    - Personal Loan
    - Mortgage
    - Investment
    - Insurance
  product_status:
    type: string
    nullable: false
  product_start_date:
    type: date
    nullable: false
  is_active:
    type: boolean
    nullable: false
  is_primary_product:
    type: boolean
    nullable: false
  product_end_date:
    type: date
    nullable: true
  monthly_fee:
    type: number
    nullable: false
    min: 0
  product_balance:
    type: number
    nullable: false
    min: 0
  synthetic_data_flag:
    type: boolean
    nullable: false
    allowed_values:
    - true
  data_origin:
    type: string
    nullable: false
    allowed_values:
    - SYNTHETIC DEMO DATA
