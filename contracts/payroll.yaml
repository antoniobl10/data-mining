dataset: payroll
contract_version: '1.0'
owner: Digital Banking Data Owner
technical_owner: Data Engineering
description: Typed accepted synthetic payroll; final states must not be backfilled
  into historical ML features.
layer: silver
primary_key:
- customer_id
allow_extra_columns: true
fields:
  customer_id:
    type: string
    nullable: false
  salary_frequency:
    type: string
    nullable: false
  snapshot_date:
    type: date
    nullable: false
  has_salary_domiciliation:
    type: boolean
    nullable: false
  payroll_start_date:
    type: date
    nullable: true
  monthly_payroll_amount:
    type: number
    nullable: false
    min: 0
  months_with_payroll:
    type: integer
    nullable: false
    min: 0
  synthetic_data_flag:
    type: boolean
    nullable: false
    allowed_values:
    - true
  data_origin:
    type: string
    nullable: false
    allowed_values:
    - SYNTHETIC DEMO DATA
