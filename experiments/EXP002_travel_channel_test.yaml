experiment_id: EXP002
name: Travel channel test
hypothesis: Push notification improves the 30-day primary conversion versus Email
  without harming customer guardrails.
owner: Synthetic Experiment Owner
status: APPROVED
approval_scope: Synthetic local simulation only; not real marketing authorization
start_date: '2026-06-01'
end_date: '2026-07-01'
population: unactivated_travel_offer
exclusions:
- marketing_contact_not_allowed
- persistent_holdout
- preexisting_target_ownership
control: Email
treatment: Push notification
primary_metric: 30-day intention-to-treat binary conversion
secondary_metrics:
- revenue_proxy
- NPS proxy
guardrails:
- unsubscribe
- complaint
- NPS proxy
- cost per customer
minimum_detectable_effect: 0.1
alpha: 0.05
power: 0.8
simulation:
  baseline_conversion: 0.12
  treatment_effect: 0.1
  conversion_value_proxy: 35.0
  exposure_rate: 0.97
  control_contact_cost: 0.08
  treatment_contact_cost: 0.03
  unsubscribe_control: 0.01
  unsubscribe_increase: 0.002
  complaint_control: 0.003
  complaint_increase: 0.001
  nps_change: 0.0
action: Travel Service Offer
