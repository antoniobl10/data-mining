experiment_id: EXP003
name: Digital re-engagement
hypothesis: Re-engagement campaign improves the 30-day primary conversion versus No
  campaign without harming customer guardrails.
owner: Synthetic Experiment Owner
status: APPROVED
approval_scope: Synthetic local simulation only; not real marketing authorization
start_date: '2026-08-01'
