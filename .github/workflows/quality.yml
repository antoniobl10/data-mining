name: Quality and security
'on':
  pull_request: {}
  push:
    branches:
    - main
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: Quality and security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements-dev.lock
    - name: Install locked dependencies and editable package
      run: 'python -m pip install --require-hashes -r requirements-dev.lock

        python -m pip install --no-deps -e .'
    - run: python -m pytest tests/contracts tests/data_quality tests/ml analytics/tests -q
    - run: python -m bandit -r analytics orchestration deployment src/platform src/contracts
        -ll
    - run: python -m pip_audit --disable-pip --no-deps -r requirements-dev.lock
    - run: 'python tools/check_repository_policy.py

        python -m deployment.deploy --env dev'
