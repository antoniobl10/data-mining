name: Validate prod release plan (no cloud deployment)
'on':
  workflow_dispatch:
    inputs:
      release_tag:
        description: SemVer tag required for production
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: deployment-plan-prod
  cancel-in-progress: false
jobs:
  release_plan:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements-dev.lock
    - name: Install locked dependencies and editable package
      run: 'python -m pip install --require-hashes -r requirements-dev.lock

        python -m pip install --no-deps -e .'
    - name: Verify release tag points at approved main commit
      env:
        RELEASE_TAG: ${{ inputs.release_tag }}
      run: python -c "import os,re,subprocess; tag=os.environ['RELEASE_TAG']; assert
        re.fullmatch(r'v[0-9]+[.][0-9]+[.][0-9]+',tag); assert subprocess.check_output(['git','rev-list','-n','1',tag],text=True).strip()==subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()"
    - run: python -m pytest tests/unit tests/contracts tests/data_quality tests/integration
        tests/end_to_end tests/ml -q
    - run: 'python -m ruff check .

        python -m bandit -r orchestration deployment src/platform src/contracts -ll'
    - run: python -m deployment.deploy --env prod --output reports/prod_release_plan.json
      env:
        BANKING_RELEASE_TAG: ${{ inputs.release_tag }}
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: prod-reference-release-plan
        path: reports/prod_release_plan.json
