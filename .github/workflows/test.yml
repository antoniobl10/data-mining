name: Tests and fixture E2E
'on':
  pull_request: {}
  push:
    branches:
    - main
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: Tests and fixture E2E-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements-dev.lock
    - name: Install locked dependencies and editable package
      run: 'python -m pip install --require-hashes -r requirements-dev.lock

        python -m pip install --no-deps -e .'
    - run: python -m pytest tests ml/tests analytics/tests --cov --cov-report=xml:reports/coverage.xml
        --cov-report=term-missing --junitxml=reports/test-results.xml
    - name: Upload aggregate test evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: test-evidence
        path: 'reports/coverage.xml

          reports/test-results.xml'
        retention-days: 7
