- name: dim_customer
  description: Current accepted-customer snapshot transformation; see docs/gold_models.md
    for grain and metric contracts.
  columns:
  - name: customer_key
    description: Stable integer surrogate key; zero is Unknown for lookup dimensions.
    tests:
    - unique
    - not_null
  - name: customer_id
    description: Sensitive source lineage identifier, unique in accepted Silver.
    tests:
    - unique
    - not_null
  - name: customer_value_segment
    description: Tie-preserving quantile tier; Unknown means incomplete score.
    tests:
    - accepted_values:
        arguments:
          values:
          - Low
          - Medium
          - High
          - Premium
          - Unknown
  - name: primary_customer_segment
    description: First matching segment by configured priority.
    tests:
    - accepted_values:
        arguments:
          values:
          - High Value
          - Affluent
          - High Balance
          - High Credit Quality
          - Long-Term Customer
          - Mass Market
