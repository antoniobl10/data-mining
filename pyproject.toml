[build-system]
requires = ["setuptools>=75,<85", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "banking-customer-analytics"
version = "1.1.0"
description = "Medallion analytics, synthetic ML and controlled local orchestration"
requires-python = ">=3.12,<3.13"
dependencies = ["pandas>=2.2,<3", "numpy>=1.26,<3", "openpyxl>=3.1,<4", "pyarrow>=16,<24", "PyYAML>=6,<7", "duckdb>=1.1,<2", "scipy>=1.12,<2", "Jinja2>=3.1,<4"]

[project.optional-dependencies]
ml = ["scikit-learn>=1.6,<1.7", "joblib>=1.4,<2", "mlflow-skinny>=3.17,<4", "matplotlib>=3.8,<4"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1", "black>=24,<27", "bandit>=1.7,<2", "pip-audit>=2.7,<3", "build>=1,<2", "nbformat>=5.10,<6", "jsonschema>=4.23,<5", "pre-commit>=4,<5"]

[project.scripts]
banking-workflow = "orchestration.run_workflow:main"
banking-deploy-plan = "deployment.deploy:main"

[tool.setuptools.packages.find]
include = ["src*", "ml*", "analytics*", "orchestration*", "deployment*", "tools*"]
exclude = ["tests*", "ml.tests*", "ml.notebooks*", "analytics.tests*", "analytics.notebooks*", "analytics.reports*", "tools.powerbi_validation*"]

[tool.black]
target-version = ["py312"]
line-length = 100
include = '/(analytics|orchestration|deployment|src/contracts|src/platform|tests/(unit|contracts|data_quality|integration|end_to_end|ml))/.*\.py$'

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["analytics/**/*.py", "orchestration/**/*.py", "deployment/**/*.py", "src/contracts/**/*.py", "src/platform/**/*.py", "tests/unit/**/*.py", "tests/contracts/**/*.py", "tests/data_quality/**/*.py", "tests/integration/**/*.py", "tests/end_to_end/**/*.py", "tests/ml/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "ml/tests", "analytics/tests"]
markers = ["integration: component integration", "end_to_end: small independent platform fixture", "private_data: requires ignored local datasets"]

[tool.coverage.run]
source = ["orchestration", "src.contracts", "src.platform", "analytics.src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 70
